<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#143b2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Woningzoeker">
    <title>{% block title %}Woningzoeker{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', path='/manifest.webmanifest') }}">
    <link rel="icon" href="{{ url_for('static', path='/icon-192.png') }}" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/icon-180.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', path='/assistance.css') }}?v=5">
    <link rel="stylesheet" href="{{ url_for('static', path='/settings.css') }}?v=3">
    <script src="{{ url_for('static', path='/app.js') }}?v=2" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">Woningzoeker</a>
      {% if session %}
        <nav><a href="/">Overzicht</a><a href="/assistance">Hulp nodig</a><a href="/settings">Instellingen</a></nav>
        <form action="/logout" method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="link-button" type="submit">Uitloggen</button>
        </form>
      {% endif %}
    </header>
    {% if dry_run %}<div class="safety-banner">DRY-RUN — echte reacties zijn uitgeschakeld</div>{% endif %}
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
