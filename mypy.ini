[mypy]
python_version = 3.12
plugins = pydantic.mypy
strict = True
exclude = app/main_base.py

[mypy-apscheduler.*]
ignore_missing_imports = True

# This compatibility module is imported by the ASGI wrapper but checked through app/main.py.
[mypy-app.main_base]
follow_imports = skip

# FastAPI and SQLAlchemy route/query inference is dynamic in the installed releases.
[mypy-app.main]
disallow_untyped_decorators = False
warn_return_any = False
disable_error_code = var-annotated,arg-type

# The comparison helper intentionally accepts SQLAlchemy Decimal values and plain test numbers.
[mypy-app.services.dedup]
disable_error_code = arg-type
